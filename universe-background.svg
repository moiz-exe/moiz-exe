
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2600" viewBox="0 0 1200 2600">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1028"/>
      <stop offset="100%" stop-color="#10051f"/>
    </linearGradient>

    <radialGradient id="nebula">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueNebula">
      <stop offset="0%" stop-color="#0891b2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stars" width="173" height="211" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="31" r="1.2" fill="#fff" opacity=".8"/>
      <circle cx="93" cy="79" r=".8" fill="#a5b4fc" opacity=".7"/>
      <circle cx="142" cy="163" r="1" fill="#fff" opacity=".6"/>
      <circle cx="51" cy="190" r=".7" fill="#67e8f9" opacity=".8"/>
      <circle cx="165" cy="15" r=".6" fill="#fff" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1200" height="2600" fill="url(#space)"/>
  <rect width="1200" height="2600" fill="url(#stars)"/>

  <g>
    <ellipse cx="150" cy="320" rx="420" ry="500" fill="url(#nebula)"/>
    <ellipse cx="1050" cy="780" rx="400" ry="470" fill="url(#blueNebula)"/>
    <ellipse cx="260" cy="1380" rx="420" ry="490" fill="url(#blueNebula)"/>
    <ellipse cx="1050" cy="1970" rx="450" ry="480" fill="url(#nebula)"/>
    <ellipse cx="420" cy="2450" rx="400" ry="320" fill="url(#blueNebula)"/>
  </g>

  <!-- Orbital paths -->
  <g fill="none" stroke="#818cf8" stroke-opacity=".24">
    <ellipse cx="1050" cy="390" rx="115" ry="36" transform="rotate(-25 1050 390)"/>
    <ellipse cx="130" cy="1080" rx="130" ry="44" transform="rotate(22 130 1080)"/>
    <ellipse cx="1020" cy="1780" rx="150" ry="46" transform="rotate(-35 1020 1780)"/>
  </g>

  <!-- Ringed planet -->
  <g transform="translate(1030 385)">
    <circle r="31" fill="#334155"/>
    <circle r="26" fill="#6366f1" opacity=".5"/>
    <ellipse rx="53" ry="14" fill="none" stroke="#a5b4fc" stroke-width="3" transform="rotate(-20)"/>
    <ellipse rx="44" ry="11" fill="none" stroke="#67e8f9" stroke-opacity=".65" transform="rotate(-20)"/>
  </g>

  <!-- Satellite -->
  <g transform="translate(160 1070) rotate(-18)">
    <rect x="-13" y="-12" width="26" height="24" rx="3" fill="#cbd5e1"/>
    <rect x="-59" y="-9" width="36" height="18" fill="#2563eb" stroke="#93c5fd"/>
    <rect x="23" y="-9" width="36" height="18" fill="#2563eb" stroke="#93c5fd"/>
    <path d="M0 -12 L0 -28 L12 -35 M0 12 L0 24" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#67e8f9"/>
  </g>

  <!-- Small rocket -->
  <g transform="translate(1000 1770) rotate(35)">
    <path d="M0 -48 Q20 -22 17 15 L0 30 L-17 15 Q-20 -22 0 -48Z" fill="#c4b5fd"/>
    <circle cy="-12" r="6" fill="#0f172a" stroke="#67e8f9" stroke-width="3"/>
    <path d="M-17 4 L-32 22 L-16 20 M17 4 L32 22 L16 20" fill="#818cf8"/>
    <path d="M-7 29 Q0 57 7 29" fill="#f59e0b" opacity=".8"/>
  </g>

  <!-- Gentle shooting-star trails -->
  <g fill="none" stroke-linecap="round">
    <path d="M790 600 L900 555" stroke="#67e8f9" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M200 1540 L275 1510" stroke="#c4b5fd" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M800 2250 L920 2200" stroke="#67e8f9" stroke-opacity=".55" stroke-width="1.5"/>
  </g>

  <!-- Subtle glow points -->
  <g fill="#c4b5fd" opacity=".75">
    <circle cx="220" cy="540" r="2"/>
    <circle cx="920" cy="930" r="2"/>
    <circle cx="310" cy="1690" r="2"/>
    <circle cx="850" cy="2380" r="2"/>
  </g>
</svg>
